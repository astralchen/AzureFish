syntax = "proto3";

// AzureFish 账号接口的权威消息定义；客户端副本由同步脚本更新，禁止独立修改。
// 时间戳统一为 Unix 毫秒；ID 和协议值不随客户端显示语言改变。
// 写请求重试必须保留原 operation_id 和完全相同的 Protobuf 字节（含未知字段）。
package azurefish.v1;

// Swift 类型使用消息原名（例如 RegisterRequest）；模块 AzureFishProtocol 提供命名空间。
option swift_prefix = "";

// 服务健康检查返回的状态与环境信息。
//
// 由无需身份凭据的 GET /health 返回；健康检查通过不代表账号已经认证。
message HealthResponse {
    // 服务状态，当前就绪响应为 "ok"；读取未设置的字段会得到空字符串。
    string status = 1;
    // 服务环境标识，当前虚构数据环境为 "local-development"；客户端应与请求环境匹配。
    string environment_id = 2;
}

// 失败请求对应的稳定业务错误信息。
//
// 与非成功 HTTP 状态一起返回；客户端按 code 和 field 本地化文案，不向用户直接展示协议标识。
message ApiError {
    // 稳定业务错误码，例如 VALIDATION_FAILED、UNAUTHENTICATED；有效错误响应必须为非空值，未知码按通用失败处理。
    string code = 1;
    // 错误关联的协议字段名；服务端未指定某个字段时为空字符串，不代表字段值本身为空。
    string field = 2;
    // 服务端生成的请求标识，与响应 X-Request-ID 一致；用于诊断，不作为业务操作去重 ID。
    string request_id = 3;
}

// 创建账号并建立新会话所需的注册输入。
//
// 发送至 POST /v1/auth/register，成功返回 HTTP 201 和 AuthResponse。
// 账号名、密码和昵称的业务规则由服务端校验；Protobuf 编码本身不验证这些约束。
message RegisterRequest {
    // 本次动作的全局唯一 UUID（36 字符）；仅同一动作的原字节重试可复用。
    string operation_id = 1;
    // 客户端生成的安装 UUID（36 字符）；绑定会话，不作为可信硬件证明。
    string device_id = 2;
    // 首尾空白移除并转小写后须为 3～32 个 ASCII 字符 [a-z0-9_]，全局唯一。
    string account_name = 3;
    // 原始密码，不 trim 或规范化；至少 12 个 Swift Character、至多 72 个 UTF-8 字节，禁止 NUL。
    string password = 4;
    // 昵称，最多 64 个 Swift Character，不能全空白；保留原值，拒绝除换行外的控制字符。
    string nickname = 5;
}

// 通过账号密码建立新会话所需的登录输入。
//
// 发送至 POST /v1/auth/login，成功返回 AuthResponse；登录不会撤销其他已有会话。
// 编码本身不验证密码是否正确，也不表示客户端已经安装登录状态。
message LoginRequest {
    // 本次登录动作的全局唯一 UUID（36 字符）；重试保持 ID 和请求字节不变。
    string operation_id = 1;
    // 客户端安装 UUID（36 字符），作为本次会话的设备标识。
    string device_id = 2;
    // 与注册相同的规范化规则：去除首尾空白、转小写，3～32 个 ASCII 字符 [a-z0-9_]。
    string account_name = 3;
    // 原始密码；至少 12 个 Swift Character、至多 72 个 UTF-8 字节，禁止 NUL，不规范化。
    string password = 4;
}

// 轮换同一会话的访问与刷新凭据所需的输入。
//
// 发送至 POST /v1/auth/refresh，成功返回下一代 AuthResponse，将刷新截止续期至服务器当前时间起 30 天；相同操作重试返回原截止。
// 同一会话应合并并发刷新；已消费的 refresh 换操作 ID 重放会撤销整个会话。
message RefreshRequest {
    // 本次刷新动作的全局唯一 UUID，须为 36 字符；响应丢失时使用同一 ID 和原字节恢复结果，不创建第二个刷新动作。
    string operation_id = 1;
    // 待刷新的不透明凭据，原样放入正文，不使用 Bearer 替代；禁止写入日志或展示在页面上。
    string refresh_token = 2;
}

// 撤销 Bearer 指定的当前会话所需的输入。
//
// 发送至 POST /v1/auth/logout，成功返回 EmptyResponse；仅退出当前会话，不退出全部设备。
// 收到成功响应后，客户端仍需自行清理会话凭据与内存状态。
message LogoutRequest {
    // 本次退出动作的全局唯一 UUID，须为 36 字符；响应丢失时在有效恢复窗口内按原 ID 与字节重试。
    string operation_id = 1;
}

// 不携带业务字段的成功确认消息。
//
// 正文可编码为零字节，响应仍使用 application/protobuf；接收方不能仅凭空正文判断业务成功。
message EmptyResponse {}

// 用户的服务端权威资料快照。
//
// 由 GET／PATCH /v1/me 或认证响应返回；持久化、界面更新和并发结果合并由客户端负责。
// 未设置的标量读取为 Protobuf 默认值，客户端仍须校验成功响应的必要字段。
message UserProfile {
    // 当前头像的不可变资源 ID；空表示默认头像。
    string avatar_id = 8;
    // 资料所属用户的小写 UUID，作为稳定账号身份；不能用昵称或账号名代替。
    string user_id = 1;
    // 服务端规范化后的唯一账号名，当前资料更新接口不允许修改。
    string account_name = 2;
    // 服务端保存的昵称文本；成功资料响应要求非空，不随客户端显示语言转换。
    string nickname = 3;
    // 用户简介，空字符串表示未设置或已清空；响应不区分这两种状态。
    string bio = 4;
    // 资料版本，从 1 开始，每次成功更新递增；用于编辑冲突检测，不以更新时间替代。
    int64 profile_version = 5;
    // 账号创建时间，单位为 Unix 毫秒；默认 0 不表示一个已验证的有效创建时间。
    int64 created_at_ms = 6;
    // 资料最后更新时间，单位为 Unix 毫秒；客户端按所需显示时区格式化，不改变协议值。
    int64 updated_at_ms = 7;
}

// 一次成功注册、登录或刷新产生的会话凭据与同账号资料。
//
// 客户端须校验环境、用户、设备及刷新上下文；成对凭据的持久化和旧代响应隔离由应用层负责。
// 令牌不得写入日志，返回此消息不代表 Keychain、登录状态或真实 IM 已接入。
message AuthResponse {
    // 会话所属服务环境，客户端须与发起请求的环境标识一致。
    string environment_id = 1;
    // 会话所属用户的小写 UUID，须与 profile.user_id 一致。
    string user_id = 2;
    // 会话绑定的安装 UUID，小写形式；不是可信硬件证明，不能独立用于认证。
    string device_id = 3;
    // 当前会话的小写 UUID；刷新保持不变，重新登录创建新会话。
    string session_id = 4;
    // 当前代次的随机不透明访问凭据，通过 Authorization: Bearer 原样发送，不在客户端解析内部身份。
    string access_token = 5;
    // 访问凭据到期时间，单位为 Unix 毫秒；最长 15 分钟且不超过当前刷新截止，刷新后旧访问凭据失效。
    int64 access_expires_at_ms = 6;
    // 当前代次的随机不透明刷新凭据，每次成功刷新替换；应与同一响应中的访问凭据一起更新。
    string refresh_token = 7;
    // 当前刷新截止，单位为 Unix 毫秒；登录或成功刷新起 30 天，相同操作重试不重复续期，不是剩余有效秒数。
    int64 refresh_expires_at_ms = 8;
    // 刷新代次，从 1 开始，成功刷新加 1；默认 0 无效，客户端不得用旧代结果覆盖新凭据。
    int64 refresh_generation = 9;
    // 认证用户的权威资料，成功响应必须包含此字段；Swift 读取默认实例不能证明字段存在，应检查 hasProfile。
    UserProfile profile = 10;
}

// 基于已读取资料版本提交的部分更新输入。
//
// 发送至 PATCH /v1/me，并携带当前会话 Bearer；至少指定一个 optional 字段。
// 版本冲突返回 HTTP 409，客户端保留编辑内容并读取最新资料，不自动覆盖冲突。
message UpdateProfileRequest {
    // 本次编辑动作的全局唯一 UUID，须为 36 字符；同一会话刷新后可用较新 Bearer 重试原 ID 与请求字节。
    string operation_id = 1;
    // 编辑依据的资料版本，必须为正数且等于当前服务端版本；成功更新后返回递增的版本。
    int64 expected_profile_version = 2;
    // 未传时保留原昵称；Swift 使用 hasNickname 区分未传和空字符串。
    //
    // 传入时最多 64 个 Swift Character，不能全空白，拒绝除换行外的控制字符；显式空昵称无效。
    optional string nickname = 3;
    // 未传时保留原简介，显式空字符串表示清空；Swift 使用 hasBio 判断是否提交此字段。
    //
    // 传入时最多 500 个 Swift Character，保留原始文本，拒绝除换行外的控制字符。
    optional string bio = 4;
}

// 按精确账号名查找可申请好友的用户；私聊发送另行检查好友关系。
message IMLookupUserRequest {
    // 使用账号接口相同的规范化规则。
    string account_name = 1;
}
// 对外可见的最小用户资料。
message IMPublicUser {
    string avatar_id = 4; // 当前头像资源 ID。
    bool deleted = 5; // 已注销身份；客户端本地化显示名。
    string user_id = 1; // 用户 UUID。
    string nickname = 2; // 昵称原文。
    int64 profile_version = 3; // 资料版本。
}
// 幂等解析唯一私聊，不允许与自己创建私聊。
message IMResolveRequest {
    string operation_id = 1; // 写动作 UUID。
    string peer_user_id = 2; // 对方用户 UUID。
}
// 创建群聊；创建者自动加入并成为群主。
message IMCreateGroupRequest {
    string operation_id = 1; // 写动作 UUID。
    string title = 2; // 1～64 字符，禁止全空白。
    repeated string member_user_ids = 3; // 不含创建者，1～99 个不重复用户 UUID。
}
// 群管理一次仅执行一种动作；使用版本检查避免覆盖其他设备的修改。
message IMUpdateGroupRequest {
    string operation_id = 1; // 写动作 UUID。
    string conversation_id = 2; // 群会话 UUID。
    int64 expected_revision = 3; // 当前会话资料版本。
    string action = 4; // rename、add、remove、leave、transfer、dissolve。
    string title = 5; // 仅 rename 使用。
    string member_user_id = 6; // 仅 add、remove、transfer 使用。
}
// 当前账号可访问的会话查询。
message IMConversationRequest {
    string conversation_id = 1; // 会话 UUID。
}
// 成员每次加入形成独立的可见区间。
message IMMembershipInterval {
    int64 joined_seq = 1; // 包含此序号。
    int64 left_seq = 2; // 不包含此序号；0 表示尚未离开。
}
// 群成员身份与历史可见边界，不随退出而删除。
message IMMember {
    string user_id = 1; // 用户 UUID。
    bool active = 2; // 当前是否仍为成员。
    repeated IMMembershipInterval intervals = 3; // 按加入时间升序。
    IMPublicUser profile = 4; // 当前可见成员资料；离开会话后使用冻结资料。
}
// 当前账号的权威阅读摘要。
message IMReadState {
    int64 read_through_seq = 1; // 用户多设备合并的阅读水位。
    int64 delivered_through_seq = 2; // 已覆盖的送达水位，至少等于阅读水位。
    int64 unread_count = 3; // 排除自己发出和已撤回消息后的精确数量。
    int64 summary_at_seq = 4; // 此摘要对应的会话最高序号。
    int64 server_revision = 5; // 摘要版本，与会话资料版本独立。
}
// 会话当前权威状态；closed 可代表解散或当前账号已离开。
message IMConversation {
    string conversation_id = 1; // 会话 UUID。
    string kind = 2; // direct 或 group。
    string title = 3; // 群标题；私聊为空。
    string owner_user_id = 4; // 群主；私聊为空。
    repeated IMMember members = 5; // 含已离开成员及历次可见区间。
    int64 server_revision = 6; // 资料版本。
    int64 boundary_revision = 7; // 成员权限边界版本。
    int64 latest_seq = 8; // 当前账号可见的最高边界，离开后不再推进。
    bool closed = 9; // 当前账号不能再向此会话发消息。
    IMReadState read_state = 10; // 当前账号的阅读摘要。
    IMMessage latest_message = 11; // 最新可见消息摘要；不代表历史同步覆盖。
}
// 发送文本消息；身份以 Bearer 为准，设备必须匹配该会话凭据。
// 连续语义文字片段；style 使用 bold=1、italic=2、underline=4、strikethrough=8 位组合。
message IMTextRun {
    string text = 1;
    uint32 style = 2;
}
message IMSendRequest {
    string operation_id = 1; // 写动作 UUID；重试保留原字节。
    string conversation_id = 2; // 已解析的权威会话 UUID。
    string message_uuid = 3; // 环境内全局唯一 UUID。
    string client_message_id = 4; // 发送者内唯一 UUID。
    string device_id = 5; // 当前凭据绑定的安装 UUID。
    string content_type = 6; // text、link、media_group、audio、file。
    int32 content_schema_version = 7; // 首期为 1。
    string text = 8; // text 类型必填，媒体类型为空。
    repeated string asset_ids = 9; // 有序就绪附件 UUID；媒体组最多 20 个，语音／文件恰好 1 个。
    repeated IMTextRun text_runs = 10; // text 的可选格式片段，拼接必须等于 text。
    string link_url = 11; // link 的原始 HTTP(S) URL，text 保留相同值供旧界面展示。
}
// 权威消息信封；撤回终态保留身份与序号，清空正文。
message IMMessage {
    string conversation_id = 1; // 会话 UUID。
    string message_uuid = 2; // 原发送端 UUID。
    string client_message_id = 3; // 原发送端幂等 UUID。
    string server_message_id = 4; // 服务端消息 UUID。
    string sender_user_id = 5; // 认证得到的发送者 UUID；系统消息为空。
    string device_id = 6; // 原发送会话设备；系统消息为空。
    int64 server_seq = 7; // 会话内严格递增，从 1 开始。
    int64 server_created_at_ms = 8; // 接受时间，Unix 毫秒。
    int64 server_revision = 9; // 正文版本，撤回递增。
    string content_type = 10; // 内容类型。
    int32 content_schema_version = 11; // 内容版本。
    string text = 12; // 撤回时为空。
    bool revoked = 13; // 不允许恢复正文。
    IMReceiptSummary receipt = 14; // 独立版本的回执摘要。
    repeated MediaAsset assets = 15; // 有序权威附件；撤回后清空，不包含路径或下载凭据。
    repeated IMTextRun text_runs = 16; // 撤回时清空。
    string link_url = 17; // 客户端生成预览；服务端不访问此 URL。
    IMSystemEvent system_event = 18; // 仅服务端生成；system 消息无用户发送者、设备及回执。
}
// 持久化的系统事件，不保存本地化文案。
message IMSystemEvent {
    string kind = 1; // friendship_accepted；未知事件显示通用占位。
    string relationship_id = 2;
    int64 relationship_revision = 3;
    string requester_user_id = 4;
    string accepter_user_id = 5;
}
// 固定发送时接收范围的回执计数；发送者不计入。
message IMReceiptSummary {
    int64 expected_count = 1;
    int64 delivered_count = 2;
    int64 read_count = 3;
    int64 audience_version = 4; // 首期固定 1。
    int64 server_revision = 5; // 独立回执版本。
}
// 单调推进已覆盖水位；不能超过当前账号可见边界。
message IMWatermarkRequest {
    string operation_id = 1;
    string conversation_id = 2;
    int64 through_seq = 3; // 非负，已读隐含送达。
}
// 发送者在接受后 120 秒内撤回自己的消息。
message IMRevokeRequest {
    string operation_id = 1;
    string conversation_id = 2;
    string message_uuid = 3;
}
// 固定上界的逆序历史分页；首次三个边界均为 0。
message IMHistoryRequest {
    string conversation_id = 1;
    int64 before_seq = 2; // 不包含此序号；首次为 0。
    int64 upper_bound_seq = 3; // 首次为 0，后续沿用响应上界。
    int64 boundary_revision = 4; // 首次为 0，后续必须匹配。
    int32 limit = 5; // 1～100；0 使用 50。
}
// 返回完整扫描区间；序号缺口可能因加入前或离开期间无权限。
message IMHistoryResponse {
    repeated IMMessage messages = 1; // 按序号降序。
    int64 upper_bound_seq = 2;
    int64 next_before_seq = 3;
    bool has_more = 4;
    int64 covered_from_seq = 5; // 0 表示无覆盖区间。
    int64 covered_through_seq = 6;
    int64 boundary_revision = 7;
    int64 earliest_available_seq = 8; // 首次加入序号；首期不清理历史。
}
// 账号事件增量，游标由服务端签名并绑定账号；空游标从流起点读取。
message IMEventsRequest {
    string cursor = 1;
    string epoch = 2; // 空值仅用于首次拉取。
    int32 limit = 3; // 1～200；0 使用 100。
}
// 同步事件是权威实体刷新通知；实体取本次读取时的最新版本。
message IMEvent {
    int64 position = 1; // 账号内连续位置，不等同于消息序号。
    string kind = 2; // conversation、message、read、receipt。
    IMConversation conversation = 3; // 含与本批次一致的当前账号摘要。
    IMMessage message = 4; // message 事件存在，其余事件不携带。
    ContactRelationship contact = 5; // contact 事件为当前权威关系，含删除墓碑。
}
message IMEventsResponse {
    string base_cursor = 1; // 对应本次输入位置的规范游标。
    repeated IMEvent events = 2;
    string next_cursor = 3; // 客户端事务提交后才保存。
    string epoch = 4;
    bool has_more = 5;
    int64 own_profile_version = 6; // 本账号资料版本；变化时通过 /me 取权威资料，不含他人私有字段。
}
// 固定会话快照；空 token 创建，后续必须原样携带 token 与 cursor。
message IMSnapshotRequest {
    string snapshot_token = 1;
    string cursor = 2;
    int32 limit = 3; // 1～100；0 使用 50。
}
message IMSnapshotResponse {
    string snapshot_token = 1; // 绑定账号，10 分钟有效。
    repeated IMConversation conversations = 2; // 含已关闭／已离开关系。
    string next_cursor = 3;
    bool complete = 4;
    string baseline_cursor = 5; // 仅末页返回；以此继续增量，再拉历史。
    string epoch = 6;
    repeated ContactRelationship contacts = 7; // 与会话共享固定快照及 baseline。
}
// 回执明细固定快照，成员变化不改变旧消息接收范围。
message IMReceiptsRequest {
    string conversation_id = 1;
    string message_uuid = 2;
    string snapshot_token = 3;
    string cursor = 4;
    int32 limit = 5; // 1～100；0 使用 50。
}
message IMReceiptDetail {
    string user_id = 1;
    bool delivered = 2;
    bool read = 3;
}
message IMReceiptsResponse {
    string snapshot_token = 1;
    IMReceiptSummary summary = 2;
    repeated IMReceiptDetail members = 3;
    string next_cursor = 4;
    bool complete = 5;
}
// WebSocket 仅发送此二进制提示；客户端使用自身已提交游标拉取 events。
message IMSyncHint {
    string epoch = 1;
    string latest_cursor = 2; // 仅提示，不能直接替代客户端 checkpoint。
    int64 own_profile_version = 3; // 无联系人或会话时，资料更新也能唤醒自己的其他在线设备。
}


// 媒体开发环境的服务端能力；大小单位为字节，时长为毫秒。
message MediaCapabilities {
    repeated string asset_kinds = 1; // image、video、audio、file、live_photo。
    int64 chunk_bytes = 2; // 固定分块大小，最后一块可较小。
    int64 image_max_bytes = 3;
    int64 video_max_bytes = 4;
    int64 audio_max_bytes = 5;
    int64 file_max_bytes = 6;
    int32 group_max_items = 7;
    int64 group_max_bytes = 8;
    int64 account_quota_bytes = 9; // 含上传预留、派生资源与分块封装预算。
    int64 instance_quota_bytes = 10;
    int32 account_concurrency = 11;
    int32 instance_concurrency = 12;
    int64 upload_lifetime_ms = 13;
    int64 grant_lifetime_ms = 14;
    int64 audio_min_duration_ms = 15;
    int64 audio_max_duration_ms = 16;
    int64 image_max_pixels = 17;
    int32 preview_max_dimension = 18;
    int32 waveform_samples = 19;
    int64 processing_timeout_ms = 20;
    bool processor_available = 21;
    int32 image_max_frames = 22;
    int32 video_max_dimension = 23;
    int32 audio_max_channels = 24;
    int32 audio_max_sample_rate = 25;
    int32 filename_max_bytes = 26;
    int64 ready_lifetime_ms = 27;
    int64 dereferenced_lifetime_ms = 28;
    int64 collection_interval_ms = 29;
    repeated MediaFormat formats = 30;
    int64 derived_reservation_bytes = 31;
}
message MediaFormat {
    string kind = 1;
    repeated string mime_types = 2;
}
// 客户端声明的原件；摘要为小写十六进制 SHA-256，服务端重新验证。
message MediaResourceInput {
    string role = 1; // original，Live Photo 另外要求 paired_video。
    string filename = 2; // 仅显示名称，不能含路径分隔或控制字符。
    string mime_type = 3; // 声明的 MIME，不能替代内容验证。
    int64 byte_count = 4; // 正数，创建时预留配额。
    string sha256 = 5;
}
message MediaCreateRequest {
    string operation_id = 1;
    string conversation_id = 2; // 已取得的权威会话，创建者必须为活跃成员。
    string kind = 3; // image、video、audio、file、live_photo。
    repeated MediaResourceInput resources = 4;
}
message MediaAssetRequest {
    string asset_id = 1;
}
message MediaAssetMutation {
    string operation_id = 1;
    string asset_id = 2;
}
// 可持久化的资源描述，无文件系统路径、对象存储路径或临时凭据。
message MediaResource {
    string resource_id = 1;
    string role = 2;
    string filename = 3;
    string mime_type = 4;
    int64 byte_count = 5;
    string sha256 = 6;
}
// 已校验的逻辑附件。普通文件不解析其内部内容，也不声明已通过病毒扫描。
message MediaAsset {
    string asset_id = 1;
    string kind = 2;
    repeated MediaResource resources = 3;
    int32 pixel_width = 4;
    int32 pixel_height = 5;
    int64 duration_ms = 6;
    bool animated = 7;
    repeated float waveform = 8; // 语音为 60 个 0～1 的有限值。
    int64 metadata_version = 9; // 首期 1，原件保持不变。
}
message MediaUploadProgress {
    string resource_id = 1;
    string upload_id = 2; // 仅附件所有者状态响应返回，不进入消息。
    int32 part_count = 3;
    repeated int32 completed_parts = 4; // 零起始、升序；缺失编号需要上传。
    string role = 5; // 对应创建请求中的资源用途，不依赖响应顺序。
}
message MediaAssetStatus {
    string asset_id = 1;
    string state = 2; // uploading、queued、processing、ready、failed、cancelled、expired、deleted。
    repeated MediaUploadProgress uploads = 3;
    MediaAsset asset = 4; // 仅 ready 存在。
    string failure_code = 5; // 稳定分类，无底层异常文本。
    int64 expires_at_ms = 6; // 无引用时截止；被有效消息引用后为 0。
}
message MediaPartResponse {
    int32 index = 1;
    int64 byte_count = 2;
    string sha256 = 3;
}
message MediaAuthorizeRequest {
    string resource_id = 1;
    string purpose = 2; // draft_preview 或 message_view。
    string message_uuid = 3; // message_view 必填；draft_preview 必须为空。
}
message MediaDownloadGrant {
    string token = 1; // 放入 X-Media-Grant 请求头，同时提供 Bearer；不写日志或消息。
    int64 expires_at_ms = 2;
    string resource_id = 3;
    string etag = 4; // 带双引号的稳定实体标识，可用于 If-Range。
    int64 byte_count = 5;
}

// 用户对的当前关系；删除和拒绝保留版本，旧事件不能恢复关系。
message ContactRelationship {
    string relationship_id = 1;
    IMPublicUser peer = 2;
    string state = 3; // pending、friend、rejected、cancelled、deleted。
    string requester_user_id = 4;
    int64 revision = 5;
    int64 updated_at_ms = 6;
    int32 semantics_version = 7; // 2：单向联系人及私有设置；0 表示旧服务。
    bool is_contact = 8; // 当前账号是否保留对方，与申请及拉黑独立。
    string remark = 9; // 仅返回当前账号自己的备注。
    bool is_blocked = 10; // 仅返回当前账号自己的拉黑设置。
    string request_id = 11; // 最近一次申请身份；旧申请迁移后保持稳定。
    string request_state = 12; // pending、accepted、rejected、cancelled；无申请为空。
    string request_message = 13; // 最近申请留言，不是聊天正文。
    int64 request_updated_at_ms = 14;
    repeated string available_actions = 15; // 当前可执行动作，包含 send；不公开对方私有设置。
}
// 查询对方当前关系；无记录时返回 state=none、revision=0。
message ContactGetRequest { string peer_user_id = 1; }
// 首次申请 expected_revision=0；后续动作必须使用当前版本。
message ContactMutationRequest {
    string operation_id = 1;
    string peer_user_id = 2;
    int64 expected_revision = 3;
    string action = 4; // request、accept、reject、cancel、delete。
    int32 semantics_version = 5; // 必须为 2；旧客户端写操作返回 CONTACT_CLIENT_UPDATE_REQUIRED。
    string remark = 6; // remark 动作专用，允许清空，最多 64 Character。
    string request_message = 7; // request 动作专用，最多 200 Character。
    string request_id = 8; // accept、reject、cancel 的申请身份；expected_revision 同时校验。
}

// 密码再次认证，仅允许 change_password、logout_all、delete_account。
message ReauthenticateRequest {
    string operation_id = 1;
    string password = 2;
    string action = 3;
}
// 五分钟内、限当前会话与指定动作使用，不替代访问凭据。
message ReauthenticateResponse {
    string token = 1;
    int64 expires_at_ms = 2;
}
// 敏感动作按原 operation_id 和原字节恢复结果；new_password 仅改密使用。
message AccountSecurityRequest {
    string operation_id = 1;
    string reauth_token = 2;
    string new_password = 3;
}
message AccountSecurityStatus {
    bool password_configured = 1;
    repeated IMConversation owned_groups = 2;
}
// JPEG 限 256 KiB、512×512；空数据表示恢复默认。资料更新使用版本冲突检查。
message UpdateAvatarRequest {
    string operation_id = 1;
    int64 expected_profile_version = 2;
    bytes jpeg = 3;
}
// 仅当前头像可读；需本人、联系人或有共同群聊历史的账号授权。
message AvatarResponse {
    string avatar_id = 1;
    bytes jpeg = 2;
}
